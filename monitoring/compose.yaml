services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    networks:
      - monitoring

  smokeping-prober:
    image: quay.io/superq/smokeping-prober:latest
    container_name: smokeping-prober
    restart: unless-stopped
    ports:
      - "9374:9374"
    command:
      - "--web.listen-address=:9374"
      - "--ping.interval=60s"
      - "192.168.20.1"
      - "10.124.184.73"
      - "195.116.35.90"
      - "188.124.167.254"
      - "80.239.145.1"
    networks:
      - monitoring

  proxmox-ve-exporter:
    image: prompve/prometheus-pve-exporter
    container_name: pve-exporter
    restart: unless-stopped
    ports:
      - "9221:9221"
    volumes:
      - ./pve-exporter/pve.yml:/etc/prometheus/pve.yml
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
